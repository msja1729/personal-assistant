name: CI

on:
  push:
    branches: [Dev, main, "feature/**"]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types (mypy)
        run: python -m mypy src
      - name: Tests (pytest)
        run: python -m pytest -q
